[package]
name = "fs-viz"
version = "0.1.0"
edition = "2021"
publish = false
description = "Host filesystem cosmos HTTP API on localhost:6006"
default-run = "fs-viz"

[features]
default = []
python = ["stardust/python"]
llvm = ["stardust/llvm"]
haskell = ["stardust/haskell"]
lean = ["stardust/lean"]

[dependencies]
stardust = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6.1"
trash = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "stardust-open"
path = "src/bin/stardust_open.rs"

[[bin]]
name = "stardust-guard"
path = "src/bin/stardust_guard.rs"

[[bin]]
name = "stardust-view"
path = "src/bin/stardust_view.rs"
test = false
bench = false

[build-dependencies]
cc = "1"
