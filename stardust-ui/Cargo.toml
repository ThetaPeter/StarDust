[package]
name = "stardust-ui"
version = "0.1.0"
edition = "2021"
publish = false
description = "Host filesystem cosmos HTTP API on localhost:6006"
autobins = false
default-run = "fs-viz"

[lib]
name = "fs_viz"
path = "src/lib.rs"

[features]
default = []
python = ["stardust/python"]
llvm = ["stardust/llvm"]
haskell = ["stardust/haskell"]

[dependencies]
stardust = { path = "../stardust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "fs-viz"
path = "src/main.rs"

[[bin]]
name = "stardust-open"
path = "src/bin/stardust_open.rs"

[[bin]]
name = "stardust-guard"
path = "src/bin/stardust_guard.rs"

[[bin]]
name = "stardust-view"
path = "src/bin/stardust_view.rs"
test = false
bench = false

[[bin]]
name = "stardust-drive"
path = "src/bin/stardust_drive.rs"
test = false
bench = false

[build-dependencies]
cc = "1"

# Same vendor as the library workspace: patches apply from the workspace being built.
[patch.crates-io]
libffi-sys = { path = "../stardust/vendor/libffi-sys" }
