name: ci

on:
  push:
  pull_request:

jobs:
  library:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stardust
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Python headers, clang, ghc, and kernel headers
        run: sudo apt-get update && sudo apt-get install -y python3 python3-dev clang ghc build-essential linux-headers-$(uname -r)
      - name: Test
        run: cargo test
      - name: Test with Python
        run: cargo test --features python
      - name: Test with LLVM
        run: cargo test --features llvm
      - name: Test with Haskell
        run: cargo test --features haskell
      - name: Build kernel module
        run: make -C kmod/stardust
      - name: Load kernel module
        run: sudo insmod kmod/stardust/stardust.ko
      - name: Check /dev/stardust
        run: test -c /dev/stardust && ls -l /dev/stardust
      - name: Test with kernel
        run: cargo test --features kernel
      - name: Unload kernel module
        if: always()
        run: sudo rmmod stardust || true

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stardust-ui
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
